<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KSChat</title>
    <link rel="stylesheet" href="chat_style2.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/socket.io/socket.io.js"></script>
    <script src = "chat_script.js" defer></script>
</head>

<body>

    <div class="overlay" onclick="close_sidebar()"></div>


    <div class="nav_bar">

    <div class="nav_left">
            <button class="hamburger" onclick="toggle_sidebar()">
            ☰
            </button>

        <!-- <button class="profile_button">Profile</button>
        <button class="about_button">About</button> -->
        <button class="logout_button" onclick="logout()">Logout</button>

    </div>

    <div id="room_title"></div>

    <div class="nav_right">

        <button id="leaveButton" onclick="leave_chat()">← Leave Chat</button>
         <button class="members_button"
        onclick="open_members()">
            👥 Members
        </button>
        
       
        

    </div>

</div>


    <div class="container_left" id="menu">
    </div>

    <div class="container_left_bottom" id="create_chatroom">

        <button class="browse_chatroom" onclick="browse_chatroom_page()">
            Browse Chatrooms
        </button>

        
        <button class="create_chatroom" onclick="create_chatroom_page()">
            Create Chatrooms
        </button>

        
    </div>

    <div class = "container_right" id = "chats">

            <!-- Messages go here -->

    </div>
    


        <div id="chat_input_area" class="chat_input_area">

            <div class="reply_edit_header"></div>

            <div class="typing_row">
                <textarea type= "text" placeholder="type here..." class="typing_box" rows="1"></textarea>
                
            </div>
            
        </div>

        <div class="members_modal_overlay" id="members_overlay">

            <div class="members_modal">

                <div class="members_modal_header">

                    <span>👥 Room Members</span>

                    <button class="members_close"
                            onclick="close_members()">

                        ✕

                    </button>

                </div>

                <div class="members_list">

                </div>

                </div>

        </div>


</body>

</html>
