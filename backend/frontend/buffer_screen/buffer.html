<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #e8edf7;

            background:
                radial-gradient(circle at 15% 20%, rgba(53, 88, 140, 0.22), transparent 32%),
                radial-gradient(circle at 85% 80%, rgba(55, 70, 115, 0.18), transparent 35%),
                linear-gradient(135deg, #070b14, #0c1425, #080d18);
        }

        /* Subtle background glow */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.22;
            z-index: -1;
            animation: floatGlow 10s ease-in-out infinite alternate;
        }

        body::before {
            background: #274c77;
            top: -150px;
            left: -130px;
        }

        body::after {
            background: #3a506b;
            bottom: -150px;
            right: -130px;
            animation-delay: 3s;
        }

        @keyframes floatGlow {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(45px, 35px);
            }
        }

        .welcome-card {
            width: 100%;
            max-width: 430px;
            padding: 2.8rem 2.5rem;
            text-align: center;

            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);

            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 18px;

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(30, 58, 95, 0.18);

            animation: cardAppear 0.6s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #f1f5f9;
            font-size: 1.9rem;
            font-weight: 650;
            letter-spacing: 0.5px;
            margin-bottom: 0.7rem;
        }

        p {
            color: rgba(203, 213, 225, 0.7);
            font-size: 0.98rem;
            letter-spacing: 0.2px;
        }

        .loader {
            width: 38px;
            height: 38px;
            margin: 1.6rem auto;

            border: 3px solid rgba(148, 163, 184, 0.18);
            border-top: 3px solid #60a5fa;
            border-radius: 50%;

            box-shadow: 0 0 12px rgba(96, 165, 250, 0.3);
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .welcome-card {
                width: 90%;
                padding: 2.2rem 1.5rem;
            }

            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <div class="welcome-card">
        <h1 id="welcomeMessage">Initializing...</h1>
        <div class="loader"></div>
        <p>Redirecting you to the inventory...</p>
    </div>

    <script>
        const user = localStorage.getItem('storedUser');

        if (user) {
            document.getElementById('welcomeMessage').innerText = `Welcome, ${user}!`;

            setTimeout(() => {
                window.location.href = '../chat_screen/chat.html';
            }, 2000);
        } else {
            alert("Unauthorized! Please login first.");
            window.location.href = 'login.html';
        }
    </script>

</body>
</html>
